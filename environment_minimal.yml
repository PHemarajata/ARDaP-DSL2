name: ardap-minimal
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Java - required for GATK (flexible version)
  - openjdk>=11
  
  # Core workflow engine
  - nextflow>=22.04.0
  
  # Essential bioinformatics tools (flexible versions)
  - bwa>=0.7.15
  - samtools>=1.15
  - bcftools>=1.15
  - bedtools>=2.29
  - picard>=2.25
  - gatk4>=4.2
  
  # Variant tools
  - snpeff>=4.3
  - pindel>=0.2.5
  - delly>=0.9
  
  # Read processing
  - trimmomatic>=0.36
  - seqtk>=1.3
  - art
  
  # Quality and phylogenetics
  - mosdepth>=0.2
  - fasttree>=2.1
  
  # Resistance detection
  - kma>=1.3
  
  # System tools
  - sqlite>=3.30
  - bc
  - coreutils
  
  # Python environment
  - python>=3.8
  - pip
  - numpy>=1.19
  - biopython>=1.75
  
  # Install Python packages
  - pip:
    - cgecore>=1.5.0
    - gitpython>=3.1.0
    - python-dateutil>=2.8.0
    - tabulate>=0.8.0